# Deploys the Cloudflare Worker (worker/ → s2ground-api on workers.dev) when something under
# worker/ changes on main – the web app itself is published by GitHub Pages straight from the
# repository root, no workflow needed (README, "GitHub Pages einschalten").
# One-time D1 schema migration: run this workflow manually (Actions → Deploy worker → Run workflow)
# with "migrate" ticked. Secrets needed (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – API token with "Edit Cloudflare Workers" + D1 edit permissions
#   CLOUDFLARE_ACCOUNT_ID  – the account ID shown in the Cloudflare dashboard
# Optional secret OPENAIP_KEY – the openAIP API key; if present it is stored as a Worker secret after each
#   deploy and used whenever the master has not entered a key in the app settings (README 6a).
name: Deploy worker

on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:
    inputs:
      migrate:
        description: "Apply worker/schema.sql (+ seed.sql) to the D1 database"
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test tests/*.test.js tests/protocol/*.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAIP_KEY: ${{ secrets.OPENAIP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: D1 migration (only when requested)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate }}
        working-directory: worker
        run: |
          npx --yes wrangler@4 d1 execute s2ground --remote --file=schema.sql
          npx --yes wrangler@4 d1 execute s2ground --remote --file=seed.sql
      - name: Deploy Worker (s2ground-api)
        working-directory: worker
        run: npx --yes wrangler@4 deploy
      - name: openAIP key as Worker secret (only if the GitHub secret OPENAIP_KEY exists)
        if: ${{ env.OPENAIP_KEY != '' }}
        working-directory: worker
        run: printf '%s' "$OPENAIP_KEY" | npx --yes wrangler@4 secret put OPENAIP_KEY
