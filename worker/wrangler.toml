# S2 Ground – Cloudflare Worker (API + live sessions only; the web app is on GitHub Pages).
# Deployed by .github/workflows/deploy.yml (wrangler deploy). Secrets are NOT in this file.
# Address after the first deploy: https://s2ground-api.<account subdomain>.workers.dev
# → enter it in src/config.js (apiBase). Same pattern as ops.wicki.aero / briefing-api.
name = "s2ground-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# Browser origins allowed to call the API (CORS). The app on its own domain, the GitHub Pages
# fallback address, s2stueve (Follow mode) and local development.
APP_ORIGINS = "https://s2ground.wicki.aero,https://bwicki.github.io,https://s2stueve.wicki.aero,http://localhost:8080,http://127.0.0.1:8080"
TOKEN_HOURS = "24"

# D1 database: create it once in the Cloudflare dashboard (Workers & Pages → D1 → "s2ground")
# and paste its ID below (README step 3). Apply worker/schema.sql via the "migrate" workflow input.
[[d1_databases]]
binding = "DB"
database_name = "s2ground"
database_id = "ba4bd4ba-3bee-495f-8750-b1e604b6d0a2"

# Durable Object: one LiveSession per ascent (WebSocket fan-out, history replay, chat, kick list)
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveSession"]

[observability]
enabled = true
